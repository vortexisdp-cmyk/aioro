<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VortexISDP - Все ссылки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .link-card:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }

        .link-icon {
            font-size: 32px;
            flex-shrink: 0;
        }

        .link-content {
            flex: 1;
        }

        .link-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }

        .link-description {
            font-size: 13px;
            color: #666;
            line-height: 1.4;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .link-card {
                padding: 15px;
            }

            .link-icon {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>VortexISDP</h1>
            <p>Все мои проекты в одном месте</p>
        </div>

        <div class="links">
            <a href="https://vortexisdp-cmyk.github.io/aioro/prompt_guide.html" class="link-card" target="_blank">
                <div class="link-icon">📚</div>
                <div class="link-content">
                    <div class="link-title">AI Prompt Guide</div>
                    <div class="link-description">Гайд по созданию промтов для ИИ</div>
                </div>
            </a>

            <a href="https://vortexisdp-cmyk.github.io/osintedu/VibeAudit2.html" class="link-card" target="_blank">
                <div class="link-icon">🔍</div>
                <div class="link-content">
                    <div class="link-title">Vibe Audit (EN)</div>
                    <div class="link-description">Аудит сайта в формате самого сайта</div>
                </div>
            </a>

            <a href="https://vortexisdp-cmyk.github.io/osintedu/VibeAudit.html" class="link-card" target="_blank">
                <div class="link-icon">🌐</div>
                <div class="link-content">
                    <div class="link-title">Vibe Audit (RU)</div>
                    <div class="link-description">Аудит сайта на русском языке</div>
                </div>
            </a>
        </div>

        <div class="footer">
            Made with AI & ❤️
        </div>
    </div>
</body>
</html>
